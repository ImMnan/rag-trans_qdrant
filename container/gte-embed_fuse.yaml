apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-gateway-ksa
  namespace: hawk
  annotations:
    iam.gke.io/gcp-service-account: support-sales@appspot.gserviceaccount.com
    # Workload Identity binding applied:
    # gcloud iam service-accounts add-iam-policy-binding support-sales@appspot.gserviceaccount.com \
    #   --role=roles/iam.workloadIdentityUser \
    #   --member="serviceAccount:support-sales.svc.id.goog[hawk/rag-gateway-ksa]"

---
apiVersion: v1
kind: Service
metadata:
  name: gte-embed-service
  namespace: hawk
spec:
  ports:
  - name: embed-http
    port: 80
    protocol: TCP
    targetPort: 8000
  # The label selector should match the deployment labels & it is useful for prefix caching feature
  selector:
    app: gte-embed
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gte-embed-fuse
  namespace: hawk
  labels:
    app: gte-embed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gte-embed
  template:
    metadata:
      labels:
        app: gte-embed
    spec:
      serviceAccountName: rag-gateway-ksa
      automountServiceAccountToken: true
      # To run on GPU: uncomment nodeSelector/tolerations below AND the nvidia.com/gpu limit
      # further down. Left commented, this pod schedules on ordinary CPU/mem nodes as-is;
      # torch auto-detects CUDA, so no other change is needed once a GPU is actually attached.
      # nodeSelector:
      #   cloud.google.com/gke-accelerator: nvidia-l4
      # tolerations:
      # - key: nvidia.com/gpu
      #   operator: Exists
      #   effect: NoSchedule
      volumes:
      - name: tmp
        emptyDir: {}
      - name: model-cache
        persistentVolumeClaim:
          claimName: embed-gte-cache
      initContainers:
      - name: download-models-hf
        image: python:3.11-slim
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            mkdir -p /models/hub
            pip install -q huggingface_hub
            python - <<'PY'
            from huggingface_hub import snapshot_download
            snapshot_download(
                'Alibaba-NLP/gte-Qwen2-1.5B-instruct',
                cache_dir='/models/hub',
                local_dir_use_symlinks=False,
            )
            snapshot_download(
                'Alibaba-NLP/gte-multilingual-reranker-base',
                cache_dir='/models/hub',
                local_dir_use_symlinks=False,
            )
            # gte-multilingual-reranker-base's config.json points (via auto_map) at this shared
            # repo for its custom configuration/modeling code; it must be cached locally too.
            snapshot_download(
                'Alibaba-NLP/new-impl',
                cache_dir='/models/hub',
                local_dir_use_symlinks=False,
            )
            PY
            test -d /models/hub/models--Alibaba-NLP--gte-Qwen2-1.5B-instruct
            test -d /models/hub/models--Alibaba-NLP--gte-multilingual-reranker-base
            test -d /models/hub/models--Alibaba-NLP--new-impl
            ls -la /models/hub | head -n 40
        volumeMounts:
        - name: model-cache
          mountPath: /models
      containers:
      - name: gte-embed-ctr
        image: immnan/gte-embed-py:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: embed-http
        env:
        - name: EMBED_MODEL
          value: "Alibaba-NLP/gte-Qwen2-1.5B-instruct"
        - name: HF_HOME
          value: "/models"
        - name: HF_HUB_CACHE
          value: "/models/hub"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        # HF_HOME is read-only (model-cache PVC); dynamic modules (trust_remote_code) need a
        # writable module cache, so redirect it to the writable /tmp emptyDir.
        - name: HF_MODULES_CACHE
          value: "/tmp/hf_modules"
        - name: EMBED_QUERY_TEMPLATE
          value: "{text}"
        - name: EMBED_DOCUMENT_TEMPLATE
          value: "{text}"
        # Cross-encoder reranker, resolved from the same model-cache PVC as the embed model.
        - name: RERANKER_MODEL
          value: "Alibaba-NLP/gte-multilingual-reranker-base"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: model-cache
          mountPath: /models
          readOnly: true
        resources:
          requests:
            cpu: "1"
            memory: 6Gi
          limits:
            cpu: "2"
            memory: 14Gi
            # nvidia.com/gpu: "1"  # uncomment (with nodeSelector/tolerations above) to run on GPU

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embed-gte-cache
  namespace: hawk
spec:
  storageClassName: premium-rwo
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
      
