apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-gateway-ksa
  namespace: hawk
  annotations:
    iam.gke.io/gcp-service-account: support-sales@appspot.gserviceaccount.com
    # Workload Identity binding applied:
    # gcloud iam service-accounts add-iam-policy-binding support-sales@appspot.gserviceaccount.com \
    #   --role=roles/iam.workloadIdentityUser \
    #   --member="serviceAccount:support-sales.svc.id.goog[hawk/rag-gateway-ksa]"

---
apiVersion: v1
kind: Service
metadata:
  name: gte-embed-service
  namespace: hawk
spec:
  ports:
  - name: embed-http
    port: 80
    protocol: TCP
    targetPort: 8000
  # The label selector should match the deployment labels & it is useful for prefix caching feature
  selector:
    app: gte-embed
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gte-embed-fuse
  namespace: hawk
  labels:
    app: gte-embed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gte-embed
  template:
    metadata:
      labels:
        app: gte-embed
    spec:
      serviceAccountName: rag-gateway-ksa
      automountServiceAccountToken: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: model-cache
        persistentVolumeClaim:
          claimName: embed-gte-cache
      initContainers:
      - name: download-models-hf
        image: python:3.11-slim
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            mkdir -p /models/hub
            pip install -q huggingface_hub
            python - <<'PY'
            from huggingface_hub import snapshot_download
            snapshot_download(
                'Alibaba-NLP/gte-Qwen2-1.5B-instruct',
                cache_dir='/models/hub',
                local_dir_use_symlinks=False,
            )
            PY
            test -d /models/hub/models--Alibaba-NLP--gte-Qwen2-1.5B-instruct
            ls -la /models/hub | head -n 40
        volumeMounts:
        - name: model-cache
          mountPath: /models
      containers:
      - name: gte-embed-ctr
        image: immnan/gte-embed-py:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: embed-http
        env:
        - name: EMBED_MODEL
          value: "Alibaba-NLP/gte-Qwen2-1.5B-instruct"
        - name: HF_HOME
          value: "/models"
        - name: HF_HUB_CACHE
          value: "/models/hub"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        - name: EMBED_QUERY_TEMPLATE
          value: "{text}"
        - name: EMBED_DOCUMENT_TEMPLATE
          value: "{text}"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: model-cache
          mountPath: /models
          readOnly: true
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 8Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embed-gte-cache
  namespace: hawk
spec:
  storageClassName: premium-rwo
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
      
