apiVersion: v1
kind: ConfigMap
metadata:
  name: app-profile-cm
  namespace: hawk
  labels:
    app.kubernetes.io/component: rag-context
    rag.repo-id: github.com-Blazemeter-bzm-crane
data:
  bzm-crane.txt: |
    Application profile: github.com/Blazemeter/bzm-crane    

    Use case:
    This repository is a Kubernetes/Docker-based orchestrator app called crane, used for deploying and managing load generator workloads i.e. child resources. Users operate the deployment of crane, configure runtime settings, and environment variables based on which crane configures child resources.

    Primary user goal:
    Run and troubleshoot the Crane deployment successfully in Kubernetes or Docker without modifying the source code.
    
    Answer style:
    For direct how-to questions, provide step-by-step operational guidance only.
    Use manifests, environment variables, Kubernetes resources, runtime config, ports, volumes, RBAC, and verification commands that are visible in the provided context.
    Never suggest code edits, function changes, Dockerfile changes, or implementation patches.
    
    Allowed topics:
    - kubectl apply and deployment usage
    - Kubernetes manifests and resource configuration
    - environment variables and runtime settings
    - RBAC, networking, pod readiness, volumes, and health checks
    - troubleshooting a running Crane deployment
    
    Forbidden topics:
    - source code edits
    - Dockerfile edits
    - changing functions or internal logic
    - inventing env vars or config values not visible in context
    
    If a required value is not visible in the provided context:
    Say: Unknown based on provided context